<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="Author" content="GreenField Local Hub Services">
    <meta name="description" content="This is the Official contact page of GreenField Local Hub">

    <!-- Line Awesome Icons -->
    <link rel="stylesheet" href="../static/line-awesome-1.3.0/1.3.0/css/line-awesome.min.css">

    <!-- Your Base Stylesheet -->
    <link rel="stylesheet" href="../static/styles/contact.css">

    <title>Contact us - GreenField Local Hub</title>
</head>

<body>

    <!-- ===========================
         CONTACT HEADER
    ============================ -->
    <section class="contact-header container">
        <h1>Contact Us</h1>
        <p>We’re here to help with any questions about our services, partnerships, or community support.</p>
    </section>

    <!-- ===========================
         CONTACT GRID
    ============================ -->
    <section class="contact-grid container">

        <!-- Contact Info Card -->
        <div class="card contact-info">
            <h2>Get in Touch</h2>

            <div class="info-item">
                <i class="las la-phone"></i>
                <div>
                    <p class="label">Phone</p>
                    <p class="value">+44 1234 567890</p>
                </div>
            </div>

            <div class="info-item">
                <i class="las la-envelope"></i>
                <div>
                    <p class="label">Email</p>
                    <p class="value">support@greenfieldhub.co.uk</p>
                </div>
            </div>

            <div class="info-item">
                <i class="las la-map-marker-alt"></i>
                <div>
                    <p class="label">Address</p>
                    <p class="value">GreenField Local Hub, Hartlepool, UK</p>
                </div>
            </div>

            <div class="socials">
                <a href="#"><i class="lab la-facebook"></i></a>
                <a href="#"><i class="lab la-instagram"></i></a>
                <a href="#"><i class="lab la-twitter"></i></a>
            </div>
        </div>

        <!-- Contact Form Card -->
        <div class="card contact-form">
            <h2>Send us a Message</h2>

            <form action="#" method="POST">

                <div class="form-group">
                    <input id="name" name="name" type="text" placeholder=" " required>
                    <label for="name">Full Name</label>
                </div>

                <div class="form-group">
                    <input id="email" name="email" type="email" placeholder=" " required>
                    <label for="email">Email Address</label>
                </div>

                <div class="form-group">
                    <textarea id="message" name="message" rows="5" placeholder=" " required></textarea>
                    <label for="message">Your Message</label>
                </div>
                <button type="submit" class="btn-primary submit-btn">Send Message</button>
            </form>
        </div>

    </section>

    <!-- || LINK TO SCRIPTS || -->
    <script type="module" src="../static/js/settings_sync.js" defer></script>
</body>
</html>
