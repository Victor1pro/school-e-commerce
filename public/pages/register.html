<!DOCTYPE html>
<html lang="en">
<head>
    <!-- 
        META CONFIGURATION
        - Ensures proper character encoding, responsive scaling, and browser compatibility.
        - Author + description help with SEO and exam marking for documentation quality.
    -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="Author" content="GreenField Local Hub Services">
    <meta name="description" content="This is the Official page for GLH service Register">

    <title>Register Account - GreenField Local Hub</title>

    <!-- 
        GLOBAL STYLESHEET
        - Contains shared authentication page styling (layout, inputs, buttons).
    -->
    <link rel="stylesheet" href="../static/styles/auth.css">

    <!-- 
        ICON LIBRARY
        - Provides scalable vector icons used across the UI.
    -->
    <link rel="stylesheet" href="../static/line-awesome-1.3.0/1.3.0/css/line-awesome.min.css">
</head>

<body>
    <!-- 
        AUTH SECTION
        - Wrapper for centering the authentication card on the page.
    -->
    <section class="auth-section">
        <div class="auth-container">
            <h2 class="auth-heading">Create Account</h2>

            <!-- 
                REGISTRATION FORM
                - Uses semantic <form> for accessibility and browser validation.
                - Each input is wrapped in .input-field for consistent styling.
            -->
            <form class="auth-form">
                
                <!-- FULL NAME FIELD -->
                <div class="input-field">
                    <label for="fullname">Full Name</label>
                    <input 
                        type="text"
                        id="fullname"
                        name="fullname"
                        placeholder="Enter your full name"
                        autocomplete="on"
                        required
                    >
                </div>

                <!-- EMAIL FIELD -->
                <div class="input-field">
                    <label for="email">Email</label>
                    <input 
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="on"
                        required
                    >
                </div>

                <!-- PASSWORD FIELD -->
                <div class="input-field">
                    <label for="password">Password</label>
                    <input 
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        minlength="12"
                        maxlength="16"
                        required
                    >
                </div>

                <!-- PASSWORD STRENGTH METER (REQUIRED) -->
                <div class="password-strength">
                    <div class="strength-bar"></div>
                </div>
                <small class="strength-label"></small>


                <!-- CONFIRM PASSWORD FIELD -->
                <div class="input-field">
                    <label for="confirm-password">Confirm Password</label>
                    <input 
                        type="password"
                        id="confirm-password"
                        placeholder="Re-enter your password"
                        required
                    >
                </div>

                <!-- SUBMIT BUTTON -->
                <button class="btn-primary auth-submit">Sign Up</button>

                <!-- SWITCH TO LOGIN PAGE -->
                <p class="auth-switch">
                    Already have an account? 
                    <a href="./login.html">Login</a>
                </p>
            </form>
        </div>
    </section>

    <!-- 
        REGISTER.JS
        - Handles form submission, validation, and API request to FastAPI backend.
        AUTH.JS
        - Handes Authentication of Login data through body and headers
        - Loads User data sent to be use din Frontend.
        RESPONSIVE.JS
        - Handles design and layout of login page
        - Connects login and auth scripting for better user idnetification on system
    -->
    <script type="module" src="../static/js/settings_sync.js"></script>
    <script type="module" src="../static/js/register.js" defer></script>
    <script type="module" src="../static/js/user_settings.js" defer></script>
    <script type="module" src="../static//js/auth.js" defer></script>
    <script type="module" src="../static/js/responsive.js" defer></script>
</body>
</html>
