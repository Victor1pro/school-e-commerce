<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="../static/styles/track-order.css">
  <link rel="stylesheet" href="../static/line-awesome-1.3.0/1.3.0/css/line-awesome.min.css">

  <title>Track Order - GreenField Local Hub</title>
</head>

<body>

  <div class="track-container">

    <h1 class="track-title">
      <i class="la la-map"></i> Track Your Order
    </h1>

    <!-- ORDER SUMMARY -->
    <div class="card">
      <h2 class="section-title"><i class="la la-receipt"></i> Order Summary</h2>
      <div id="track-order-summary"></div>
    </div>

    <!-- SHIPPING INFO -->
    <div class="card">
      <h2 class="section-title"><i class="la la-truck"></i> Shipping Info</h2>
      <div id="track-shipping" class="ship-info"></div>
    </div>

    <!-- TIMELINE -->
    <div class="card">
      <h2 class="section-title"><i class="la la-clock"></i> Tracking Timeline</h2>
      <div class="progress-wrapper">
        <div class="progress-bar"></div>
      </div>
      <div id="track-timeline" class="timeline"></div>
    </div>

    <a href="/order-history.html" class="back-btn">Back to Orders</a>

  </div>

  <!-- || LINK TO JAVASCRIPT || -->
  <script type="module" src="../static/js/settings_sync.js" defer></script>
  <script type="module" src="../static/js/track-order.js" defer></script>

</body>
</html>
