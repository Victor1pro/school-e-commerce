<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Base + Checkout Styles -->
  <link rel="stylesheet" href="../static/styles/order.css">
  <link rel="stylesheet" href="../static/line-awesome-1.3.0/1.3.0/css/line-awesome.min.css">

  <title>Your Order - GreenField Local Hub</title>

  <style>
    
  </style>
</head>

<body>

  <div class="order-card">

    <!-- HEADER -->
    <div class="order-header">
      <i class="la la-receipt icon"></i>
      <h1>Your Order</h1>
      <p>Thank you for shopping with GreenField Local Hub</p>
    </div>

    <!-- ORDER DETAILS -->
    <div class="order-section">
      <h2><i class="la la-info-circle"></i> Order Details</h2>
      <div class="order-info">
        <div><span>Order ID:</span> #GF-123456</div>
        <div><span>Date:</span> April 13, 2026</div>
        <div><span>Status:</span> Processing</div>
      </div>
    </div>

    <!-- ITEMS -->
    <div class="order-section">
      <h2><i class="la la-shopping-bag"></i> Items</h2>

      <div class="order-items">
        <div class="order-item">
          <div>
            <div class="order-item-name">Organic Honey</div>
            <div class="order-item-qty">Qty: 2</div>
          </div>
          <div class="order-item-price">£19.98</div>
        </div>

        <div class="order-item">
          <div>
            <div class="order-item-name">Fresh Farm Eggs</div>
            <div class="order-item-qty">Qty: 1</div>
          </div>
          <div class="order-item-price">£3.99</div>
        </div>
      </div>

      <div class="order-total">
        <span>Total</span>
        <span>£23.97</span>
      </div>
    </div>

    <!-- BUTTON -->
    <a href="./shop.html" class="order-btn">
      Continue Shopping
    </a>

  </div>

  <script type="module" src="../static/js/settings_sync.js" defer></script>
  <script type="module" src="../static/js/order.js" defer></script>
</body>
</html>
