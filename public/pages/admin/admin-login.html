<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="Author" content="GreenField Local Hub Services">
    <meta name="description" content="Admin Login - GreenField Local Hub">

    <title>Admin Login - GreenField Local Hub</title>

    <!-- AUTH + BASE STYLES -->
    <link rel="stylesheet" href="/public/static/styles/auth.css">

    <!-- ICONS -->
    <link rel="stylesheet" href="/public/static/line-awesome-1.3.0/1.3.0/css/line-awesome.min.css">
</head>

<body>
    <section class="auth-section">
        <div class="auth-container">
            <h2 class="auth-heading">Admin Login</h2>
            <p class="auth-switch" style="margin-top:-10px;">
                <i class="la la-shield-alt"></i> Restricted Access
            </p>

            <form class="auth-form">

                <!-- EMAIL -->
                <div class="input-field">
                    <label for="email">Admin Email</label>
                    <input 
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter admin email"
                        autocomplete="on"
                        required
                    >
                </div>

                <!-- PASSWORD -->
                <div class="input-field">
                    <label for="password">Password</label>
                    <input 
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        minlength="12"
                        maxlength="16"
                        required
                    >
                </div>

                <!-- SUBMIT -->
                <button class="btn-primary auth-submit">Sign In</button>

                <p class="auth-switch">
                    Not an admin?  
                    <a href="/public/pages/login.html">User Login</a>
                </p>
            </form>
        </div>
    </section>

    <!-- JS -->
    <script type="module" src="/public/static/js/settings_sync.js" defer></script>
    <script type="module" src="/public/static/js/login.js" defer></script>
    <script type="module" src="/public/static/js/auth.js" defer></script>
    <script type="module" src="/public/static/js/responsive.js" defer></script>
</body>
</html>
