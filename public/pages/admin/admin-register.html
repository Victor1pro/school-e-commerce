<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="Author" content="GreenField Local Hub Services">
    <meta name="description" content="Admin Registration - GreenField Local Hub">

    <title>Create Admin Account - GreenField Local Hub</title>

    <!-- AUTH + BASE STYLES -->
    <link rel="stylesheet" href="/public/static/styles/auth.css">

    <!-- ICONS -->
    <link rel="stylesheet" href="/public/static/line-awesome-1.3.0/1.3.0/css/line-awesome.min.css">
</head>

<body>
    <section class="auth-section">
        <div class="auth-container">
            <h2 class="auth-heading">Create Admin Account</h2>
            <p class="auth-switch" style="margin-top:-10px;">
                <i class="la la-user-shield"></i> Admin Access Only
            </p>

            <form class="auth-form">

                <!-- FULL NAME -->
                <div class="input-field">
                    <label for="fullname">Full Name</label>
                    <input 
                        type="text"
                        id="fullname"
                        name="fullname"
                        placeholder="Enter full name"
                        autocomplete="on"
                        required
                    >
                </div>

                <!-- EMAIL -->
                <div class="input-field">
                    <label for="email">Admin Email</label>
                    <input 
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter admin email"
                        autocomplete="on"
                        required
                    >
                </div>

                <!-- PASSWORD -->
                <div class="input-field">
                    <label for="password">Password</label>
                    <input 
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        minlength="12"
                        maxlength="16"
                        required
                    >
                </div>

                <!-- STRENGTH METER -->
                <div class="password-strength">
                    <div class="strength-bar"></div>
                </div>
                <small class="strength-label"></small>

                <!-- CONFIRM PASSWORD -->
                <div class="input-field">
                    <label for="confirm-password">Confirm Password</label>
                    <input 
                        type="password"
                        id="confirm-password"
                        placeholder="Re-enter password"
                        required
                    >
                </div>

                <!-- SUBMIT -->
                <button class="btn-primary auth-submit">Create Admin</button>

                <p class="auth-switch">
                    Already an admin?  
                    <a href="./admin-login.html">Login</a>
                </p>
            </form>
        </div>
    </section>

    <!-- JS -->
    <script type="module" src="/public/static/js/settings_sync.js"></script>
    <script type="module" src="/public/static/js/register.js" defer></script>
    <script type="module" src="/public/static/js/auth.js" defer></script>
    <script type="module" src="/public/static/js/responsive.js" defer></script>
</body>
</html>
